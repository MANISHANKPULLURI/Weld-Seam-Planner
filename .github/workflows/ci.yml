name: CI

on:
  push:
    branches: ["**"]
    paths: ['packages/**', 'backend/**', 'frontend/**', 'package.json', 'bun.lock', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['packages/**', 'backend/**', 'frontend/**', 'package.json', 'bun.lock', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
